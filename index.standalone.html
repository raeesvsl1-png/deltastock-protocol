                </div>

                <div className="p-6 rounded-2xl glass-panel border border-[#00E676]/40 bg-[#00E676]/5">
                  <div className="text-xs font-mono text-[#00E676] font-bold uppercase">Result: Combined Flat</div>
                  <h3 className="text-lg font-bold text-white mt-1">Pure Fee Capture</h3>
                  <div className="my-6 h-36 bg-slate-950 rounded-xl p-2 flex items-center justify-center border border-[#00E676]/30">
                    <svg viewBox="0 0 200 100" className="w-full h-full">
                      <line x1="10" y1="50" x2="190" y2="50" stroke="#00E676" strokeWidth="4"/>
                      <circle cx={100 + (priceMovePercent * 4.5)} cy="50" r="7" fill="#00E676"/>
                    </svg>
                  </div>
                  <div className="flex justify-between text-xs font-mono">
                    <span className="text-slate-300">Net Portfolio Value:</span>
                    <span className="text-white font-bold">${netVal.toLocaleString('en-US', { maximumFractionDigits: 2 })}</span>
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* VAULT STRATEGIES MARKETPLACE */}
          <section id="strategies" className="py-20 bg-[#0E131F] border-t border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-6">
                <div>
                  <div className="text-xs font-mono text-[#00E5FF] font-bold uppercase mb-2">High Yield Vaults</div>
                  <h2 className="text-3xl sm:text-5xl font-extrabold text-white">
                    Delta-Neutral <span className="text-gradient-emerald">Vault Strategies</span>
                  </h2>
                </div>

                <div className="flex gap-2">
                  {['All', 'Tech Sector', 'Index ETF', 'High Yield'].map(cat => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`px-4 py-2 rounded-lg text-xs font-mono font-bold transition-all ${
                        selectedCategory === cat ? 'bg-[#00E676] text-black' : 'bg-slate-900 text-slate-400'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              <div className="mt-10 grid grid-cols-1 md:grid-cols-3 gap-6">
                {filteredStrategies.map((s) => (
                  <div key={s.id} className="p-6 rounded-2xl glass-panel glass-panel-hover flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between text-xs font-mono text-slate-400">
                        <span>{s.category}</span>
                        <span className="text-[#00E676] font-bold">{s.status}</span>
                      </div>

                      <div className="mt-4 flex items-center gap-3">
                        <div className="w-12 h-12 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center font-mono font-bold text-white text-lg">
                          {s.assetSymbol}
                        </div>
                        <div>
                          <h3 className="font-bold text-white text-lg">{s.name}</h3>
                          <p className="text-xs text-slate-400 font-mono">{s.assetName}</p>
                        </div>
                      </div>

                      <div className="mt-6 p-4 rounded-xl bg-slate-950 border border-slate-800 flex justify-between items-baseline font-mono">
                        <span className="text-xs text-slate-400">Net Est APY:</span>
                        <span className="text-3xl font-extrabold text-[#00E676]">+{s.estApy}%</span>
                      </div>

                      <div className="mt-4 space-y-1.5 text-xs font-mono text-slate-400">
                        <div className="flex justify-between">
                          <span>TVL:</span>
                          <span className="text-white font-bold">${(s.tvl / 1000000).toFixed(2)}M USDC</span>
                        </div>
                        <div className="flex justify-between">
                          <span>Spot LP Venue:</span>
                          <span className="text-slate-300">{s.lpVenue}</span>
                        </div>
                        <div className="flex justify-between">
                          <span>Perp Short Venue:</span>
                          <span className="text-[#00E5FF]">{s.perpVenue}</span>
                        </div>
                      </div>
                    </div>

                    <button
                      onClick={() => handleOpenDeposit(s)}
                      className="mt-6 w-full py-3 rounded-xl bg-[#00E676] text-black font-extrabold text-sm hover:shadow-lg hover:shadow-[#00E676]/20 transition-all"
                    >
                      Deposit & Earn Yield →
                    </button>
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* YIELD CALCULATOR */}
          <section id="calculator" className="py-20 bg-[#0B0E14]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="text-center max-w-2xl mx-auto mb-10">
                <div className="text-xs font-mono text-[#00E676] font-bold uppercase mb-2">ROI Calculator</div>
                <h2 className="text-3xl sm:text-5xl font-extrabold text-white">
                  Calculate Your <span className="text-gradient-emerald">Hedged Fee Earnings</span>
                </h2>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <div className="lg:col-span-5 p-6 rounded-2xl glass-panel border border-slate-800 space-y-6">
                  <div>
                    <label className="text-xs font-mono text-slate-400 block mb-2">Deposit Amount (USDC):</label>
                    <input
                      type="number" value={calcDeposit}
                      onChange={(e) => setCalcDeposit(Math.max(100, parseFloat(e.target.value) || 0))}
                      className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-white font-mono text-xl font-bold"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-mono text-slate-400 block mb-2">Select Vault Strategy:</label>
                    <select
                      value={calcVaultId} onChange={(e) => setCalcVaultId(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-white font-mono text-sm"
                    >
                      {STRATEGIES.map(s => (
                        <option key={s.id} value={s.id}>{s.name} ({s.estApy}% APY)</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-mono text-slate-400 block mb-2">Market Crash Stress Test:</label>
                    <div className="flex justify-between text-xs font-mono text-rose-400 mb-1">
                      <span>Simulated Stock Price Drop:</span>
                      <span>{calcCrash}%</span>
                    </div>
                    <input
                      type="range" min="-40" max="20" step="5" value={calcCrash}
                      onChange={(e) => setCalcCrash(parseInt(e.target.value))}
                      className="w-full h-2 bg-slate-800 rounded-lg accent-rose-500"
                    />
                  </div>
                </div>

                <div className="lg:col-span-7 space-y-4">
                  <div className="p-6 rounded-2xl glass-panel border border-[#00E676]/50 bg-[#00E676]/10">
                    <div className="text-xs font-mono text-[#00E676] font-bold uppercase">DeltaStock Strategy (Hedged)</div>
                    <div className="mt-2 flex justify-between items-baseline">
                      <div className="text-4xl font-extrabold font-mono text-[#00E676]">
                        ${deltaTotal.toLocaleString('en-US', { maximumFractionDigits: 2 })}
                      </div>
                      <div className="text-sm font-mono text-white font-bold">
                        +${deltaYield.toLocaleString('en-US', { maximumFractionDigits: 2 })} Net Yield
                      </div>
                    </div>
                    <p className="mt-3 text-xs text-slate-300">
                      ✅ Stock price drop ({calcCrash}%) was completely hedged out. Principal preserved + fee yield captured.
                    </p>
                  </div>

                  <div className="p-5 rounded-2xl glass-panel border border-slate-800">
                    <div className="flex justify-between text-xs font-mono text-slate-400">
                      <span>Unhedged DEX LP (Without Short):</span>
                      <span className="text-amber-400">${unhedgedTotal.toLocaleString('en-US', { maximumFractionDigits: 2 })}</span>
                    </div>
                  </div>

                  <div className="p-5 rounded-2xl glass-panel border border-slate-800">
                    <div className="flex justify-between text-xs font-mono text-slate-400">
                      <span>Direct Stock Holding:</span>
                      <span className="text-rose-400">${buyHoldTotal.toLocaleString('en-US', { maximumFractionDigits: 2 })}</span>
                    </div>
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* DAO TREASURY & STAKING */}
          <section id="treasury" className="py-20 bg-[#0E131F] border-t border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
              
              <div className="text-xs font-mono text-[#00E5FF] font-bold uppercase mb-2">On-Chain Governance</div>
              <h2 className="text-3xl sm:text-5xl font-extrabold text-white">
                DAO Treasury & <span className="text-gradient-emerald">$DSK Staking</span>
              </h2>
              <p className="mt-3 text-slate-300 text-base max-w-xl mx-auto">
                50% of protocol performance fees are distributed weekly to $DSK governance stakers.
              </p>

              <div className="mt-10 p-8 rounded-2xl glass-panel border border-[#00E676]/40 max-w-3xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6">
                <div className="text-left">
                  <div className="text-xs font-mono text-slate-400">DAO Treasury Reserve:</div>
                  <div className="text-4xl font-extrabold font-mono text-white">$14,850,240 USDC</div>
                  <div className="text-xs text-[#00E676] mt-1">Weekly Profit Pool: $142,500 USDC</div>
                </div>

                <button
                  onClick={() => setIsWalletModalOpen(true)}
                  className="px-6 py-3.5 rounded-xl bg-[#00E676] text-black font-extrabold text-sm hover:shadow-lg hover:shadow-[#00E676]/20 transition-all"
                >
                  Stake $DSK & Earn Dividends →
                </button>
              </div>

            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-[#080B10] border-t border-slate-800/80 py-10 text-center text-xs font-mono text-slate-500">
            <div className="max-w-7xl mx-auto px-4">
              <p>© 2026 DeltaStock Protocol. Delta-Neutral Yield on Tokenized Equities & RWAs.</p>
            </div>
          </footer>

          {/* WALLET MODAL */}
          {isWalletModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md bg-[#0B0E14] border border-slate-800 rounded-3xl p-6 relative space-y-4">
                <button onClick={() => setIsWalletModalOpen(false)} className="absolute right-4 top-4 text-slate-400">✕</button>
                <h3 className="text-xl font-bold text-white">{wallet.isConnected ? 'Connected Wallet' : 'Connect Wallet'}</h3>
                
                {wallet.isConnected ? (
                  <div className="space-y-4 font-mono text-xs">
                    <div className="p-3 bg-slate-950 rounded-xl">Address: {wallet.address}</div>
                    <div className="p-3 bg-slate-950 rounded-xl text-[#00E676]">Balance: ${wallet.usdcBalance.toLocaleString()} USDC</div>
                    <button onClick={handleDisconnect} className="w-full py-3 bg-rose-500/20 text-rose-400 font-bold rounded-xl">Disconnect</button>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {['MetaMask', 'Phantom', 'Coinbase Wallet', 'WalletConnect'].map(name => (
                      <button key={name} onClick={handleConnect} className="w-full p-3 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 text-left">
                        {name}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* DEPOSIT MODAL */}
          {isDepositModalOpen && selectedStrategy && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md bg-[#0B0E14] border border-slate-800 rounded-3xl p-6 relative space-y-4">
                <button onClick={() => { setIsDepositModalOpen(false); setIsSuccess(false); }} className="absolute right-4 top-4 text-slate-400">✕</button>
                
                {isSuccess ? (
                  <div className="text-center space-y-4 py-4">
                    <div className="text-4xl">✅</div>
                    <h3 className="text-xl font-bold text-white">Deposit Confirmed!</h3>
                    <p className="text-xs text-slate-300">Successfully deposited ${depositInput} USDC into {selectedStrategy.name}.</p>
                    <button onClick={() => { setIsDepositModalOpen(false); setIsSuccess(false); }} className="w-full py-3 bg-[#00E676] text-black font-bold rounded-xl">Done</button>
                  </div>
                ) : (
                  <>
                    <h3 className="text-xl font-bold text-white">Deposit into {selectedStrategy.assetSymbol}</h3>
                    <div className="p-3 bg-slate-950 rounded-xl text-xs font-mono">
                      <div>Net APY: <span className="text-[#00E676] font-bold">+{selectedStrategy.estApy}%</span></div>
                      <div>Venue: {selectedStrategy.lpVenue}</div>
                    </div>
                    <div>
                      <label className="text-xs font-mono text-slate-400 block mb-1">Deposit USDC:</label>
                      <input
                        type="number" value={depositInput} onChange={(e) => setDepositInput(e.target.value)}
                        className="w-full px-4 py-3 bg-slate-950 border border-slate-700 text-white font-mono font-bold rounded-xl"
                      />
                    </div>
                    <button
                      onClick={handleExecuteDeposit} disabled={isExecuting}
                      className="w-full py-3.5 bg-[#00E676] text-black font-extrabold rounded-xl"
                    >
                      {isExecuting ? 'Executing Hedged Deposit...' : `Confirm Deposit $${depositInput} USDC`}
                    </button>
                  </>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
